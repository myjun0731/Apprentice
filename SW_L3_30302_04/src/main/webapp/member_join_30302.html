<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
	body {
		font-family: '맑은 고딕', sans-serif;
		margin: 20px;
	}
	
	h3 {
		font-weight: bold;
		text-align: left;
	}
	
	fieldset {
		border: 1px solid #aaa;
		margin-bottom: 15px;
		padding: 10px;
		border-radius: 4px;
	}
	
	legend {
		font-weight: bold;
		padding: 0 5px;
	}
	
	.row {
		margin-bottom: 8px;
	}
	
	label.title {
		display: inline-block;
		width: 100px;
		font-weight: bold;
		font-size: 0.9rem;
	}
	
	input[type="text"], input[type="number"], select {
		padding: 3px;
	}
	
	.btn-group {
		text-align: center;
		margin-top: 20px;
	}
	
	button {
		padding: 5px 15px;
		margin: 0 5px;
		cursor: pointer;
	}
</style>
</head>
<body>

	<h3>도서 대여 신청 입력</h3>

	<form action="#">
		<fieldset>
			<legend>회원 선택</legend>
			<label><input type="radio" name="member_type"
				value="existing"> 기존 회원</label>
				<label><input type="radio"
				name="member_type" value="new"> 신규 회원</label>
		</fieldset>

		<fieldset>
			<legend>대여자 정보</legend>
			<div class="row">
				<label class="title">이름:</label>
				<input type="text" placeholder="이름 입력">
			</div>
			<div class="row">
				<label class="title">연락처:</label> <select name="phone_prefix">
					<option value="010">010</option>
					<option value="011">011</option>
				</select> - <input type="text" size="4" maxlength="4"> - <input
					type="text" size="4" maxlength="4">
			</div>
			<div class="row">
				<label class="title">이메일:</label> <input type="text"> @ <select
					name="email_domain">
					<option value="naver.com">naver.com</option>
					<option value="gmail.com">gmail.com</option>
					<option value="self">직접입력</option>
				</select>
			</div>
		</fieldset>

		<fieldset>
			<legend>도서 대여 정보</legend>
			<div class="row">
				<label class="title">도서 선택:</label> <select name="book_select">
					<option value="B0001">B0001 - 자바프로그래밍</option>
					<option value="B0002">B0002 - 데이터베이스</option>
				</select>
			</div>
			<div class="row">
				<label class="title">대여일자:</label> <input type="date">
			</div>
			<div class="row">
				<label class="title">반납예정일:</label> <input type="date">
			</div>
			<div class="row">
				<label class="title">인원 수:</label> <input type="number" value="1"
					min="1" style="width: 50px;">
			</div>
			<div class="row">
				<label class="title">좌석 선택:</label>
					<select name="seat">
					<option value="A1">A1</option>
					<option value="A2">A2</option>
				</select>
			</div>
		</fieldset>

		<fieldset>
			<legend>결제 및 확인</legend>
			<div class="row">
				<label class="title">결제수단:</label>
				<label><input type="radio" name="payment" value="card" checked> 카드결제</label>
				<label><input type="radio" name="payment" value="cash"> 현금결제</label>
				<label><input type="radio" name="payment" value="mobile"> 모바일결제</label>
			</div>
			<div class="row">
				<label class="title">비고메모:</label>
				<input type="text" placeholder="특이사항 입력" style="width: 300px;">
			</div>
		</fieldset>

		<div class="btn-group">
			<button type="submit">신청하기</button>
			<button type="button">취소하기</button>
		</div>
	</form>

</body>
</html>
