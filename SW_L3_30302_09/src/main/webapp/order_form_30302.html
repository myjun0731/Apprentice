<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
	<title>Insert title here</title>
    <style>
        body {
            margin: 20px;
        }

        h3 {
            text-align: left;
            font-weight: bold;
            margin-bottom: 10px;
        }

        fieldset {
            border: 1px solid black;
            margin-bottom: 10px;
            width: 400px;
            padding: 10px;
        }

        legend {
            font-weight: bold;
            font-size: 0.9em;
        }

        .input-group {
            margin-bottom: 10px;
        }

        label {
            display: inline-block;
            width: 80px;
            font-size: 0.9em;
        }

        input[type="text"], select, input[type="number"] {
            width: 200px;
            padding: 3px;
        }

        .btn-area {
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h3>주문 정보 입력</h3>

    <form action="#">
        
        <fieldset>
            <legend>고객 정보</legend>
            <div class="input-group">
                <label for="cust_id">고객ID</label>
                <input type="text" id="cust_id" name="cust_id">
            </div>
            <div class="input-group">
                <label for="cust_name">고객명</label>
                <input type="text" id="cust_name" name="cust_name">
            </div>
        </fieldset>

        <fieldset>
            <legend>상품 정보</legend>
            <div class="input-group">
                <label for="product">상품선택</label>
                <select id="product" name="product">
                    <option value="notebook">노트북</option>
                    <option value="keyboard">키보드</option>
                    <option value="mouse">무선마우스</option>
                    <option value="monitor">모니터</option>
                    <option value="earphone">이어폰</option>
                </select>
            </div>
            <div class="input-group">
                <label for="quantity">수량</label>
                <input type="number" id="quantity" name="quantity" min="1" value="1">
            </div>
        </fieldset>

        <fieldset>
            <legend>배송 및 결제</legend>
            <div class="input-group">
                <label for="address">배송지 주소</label>
                <input type="text" id="address" name="address">
            </div>
            <div class="input-group">
                <label>결제수단</label>
                <input type="radio" id="card" name="payment" value="card" checked>
                <label for="card" style="width: auto;">카드</label>
                
                <input type="radio" id="bank" name="payment" value="bank">
                <label for="bank" style="width: auto;">무통장</label>
            </div>

            <div class="btn-area">
                <input type="submit" value="주문하기">
                <input type="reset" value="취소">
            </div>
        </fieldset>

    </form>

</body>
</html>
